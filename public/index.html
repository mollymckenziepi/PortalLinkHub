<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Portal Link Hub Site</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <img src="./assets/logo.png" alt="Public Impact logo" class="logo">
    <h1 class="site-title">OC Portal Link Hub Site</h1>
  </header>

  <main>
    <section class="search-section">
      <h2 class="section-heading">How Can I Help You?</h2>
      <div class="search-box">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
          <line x1="15.4" y1="15.4" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search for a link..."
          autocomplete="off"
          aria-label="Search link titles"
        >
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </section>

    <section class="popular-section">
      <h2 class="section-heading">Popular Links</h2>
      <div id="popular-pills" class="pill-row">
        <p class="empty-note">No link activity yet.</p>
      </div>
    </section>

    <section class="browse-section">
      <h2 class="section-heading">Resources &amp; Guides</h2>
      <div id="resource-grid" class="category-grid"></div>
    </section>

    <section class="scribe-section">
      <h2 class="section-heading">Scribe Links</h2>
      <div id="link-tree" class="link-tree"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Internal tool for navigating the OC Portal.</p>
  </footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
